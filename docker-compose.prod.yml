# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Production docker-compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Prerequisites:
#   - .env.prod file with all secrets
#   - TLS certificates in ./nginx/certs/
#   - External network 'hemosafe_net' created:
#     docker network create hemosafe_net
# ─────────────────────────────────────────────────────────────────────────────

name: hemosafe-prod

networks:
  hemosafe_net:
    external: true
  internal:
    driver: bridge
    internal: true   # no direct internet access for DB/Redis

services:

  # ── PostgreSQL Primary ──────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hemosafe-postgres
    restart: always
    networks: [internal]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  # ── PostgreSQL Read Replica ─────────────────────────────────────────────────
  postgres-replica:
    image: postgis/postgis:16-3.4-alpine
    container_name: hemosafe-postgres-replica
    restart: always
    networks: [internal]
    environment:
      POSTGRES_USER:      ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
      POSTGRES_DB:        ${POSTGRES_DB}
      PGUSER:             ${POSTGRES_USER}
      POSTGRES_PRIMARY_HOST: postgres
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres/setup-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Redis Cluster (sentinel mode for HA) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hemosafe-redis
    restart: always
    networks: [internal]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # ── NestJS API (multiple replicas) ──────────────────────────────────────────
  api:
    image: ${REGISTRY}/hemosafe-api:${IMAGE_TAG:-latest}
    restart: always
    networks: [internal, hemosafe_net]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env.prod
    environment:
      NODE_ENV:             production
      PORT:                 3001
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay:        30s
        order:        start-first    # zero-downtime rolling update
        failure_action: rollback
      rollback_config:
        parallelism: 1
      resources:
        limits:
          memory: 1G
          cpus: '1'
      restart_policy:
        condition:  on-failure
        delay:      10s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  web:
    image: ${REGISTRY}/hemosafe-web:${IMAGE_TAG:-latest}
    restart: always
    networks: [internal, hemosafe_net]
    depends_on: [api]
    environment:
      NODE_ENV:            production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
      NEXT_PUBLIC_WS_URL:  wss://${DOMAIN}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay:        20s
        order:        start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: hemosafe-nginx
    restart: always
    networks: [hemosafe_net]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - nginx_logs:/var/log/nginx
    depends_on: [api, web]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── Automated DB backup (runs daily at 02:00) ───────────────────────────────
  db-backup:
    image: postgis/postgis:16-3.4-alpine
    container_name: hemosafe-db-backup
    restart: always
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_BUCKET:  ${BACKUP_S3_BUCKET}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION:    ${AWS_REGION:-eu-west-3}
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: crond
    command: -f -d 8
    configs:
      - source: backup_crontab
        target: /etc/crontabs/root

configs:
  backup_crontab:
    content: "0 2 * * * /bin/sh /backup.sh >> /var/log/backup.log 2>&1\n"

volumes:
  postgres_data:
  postgres_replica_data:
  postgres_backups:
  redis_data:
  nginx_logs:
