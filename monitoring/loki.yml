# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Loki configuration
# Single-process mode for production (< 50 GB/day ingestion)
# ─────────────────────────────────────────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Ingestion limits ──────────────────────────────────────────────────────────
limits_config:
  ingestion_rate_mb:        32
  ingestion_burst_size_mb:  64
  max_streams_per_user:     10000
  max_label_names_per_series: 20
  # Retention
  retention_period: 720h  # 30 days

# ── Schema / storage ─────────────────────────────────────────────────────────
schema_config:
  configs:
    - from: 2024-01-01
      store:    tsdb
      object_store: filesystem
      schema:   v13
      index:
        prefix: loki_index_
        period: 24h

# ── Compactor (retention enforcement) ────────────────────────────────────────
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# ── Query ─────────────────────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# ── Ruler (alert rules from LogQL) ────────────────────────────────────────────
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# ── Analytics ─────────────────────────────────────────────────────────────────
analytics:
  reporting_enabled: false
