# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Prometheus configuration
# Scrapes: Node Exporter, cAdvisor, NestJS API, PostgreSQL, Redis, Alertmanager
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project:     hemosafe

# ── Alert rules ──────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alerts/*.yml

# ── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# ── Scrape configurations ─────────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # ── Node Exporter — host CPU / memory / disk / network ─────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: hemosafe-prod

  # ── cAdvisor — Docker container resource usage ──────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Drop internal / infrastructure containers to reduce cardinality
      - source_labels: [container_label_com_docker_compose_service]
        regex: (prometheus|grafana|loki|promtail|alertmanager|node-exporter|cadvisor)
        action: drop

  # ── NestJS API — application metrics (prom-client) ─────────────────────────
  - job_name: hemosafe-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: [api:3001]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: hemosafe-api

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: hemosafe-postgres

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: hemosafe-redis

  # ── Alertmanager self-monitoring ────────────────────────────────────────────
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # ── Nginx (stub_status exposed on internal port 8081) ──────────────────────
  - job_name: nginx
    metrics_path: /stub_status
    static_configs:
      - targets: [nginx:8081]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: hemosafe-nginx
