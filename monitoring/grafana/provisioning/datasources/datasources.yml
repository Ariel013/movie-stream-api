# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Grafana datasource provisioning
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    editable: false

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        # Link requestId in logs to a Tempo trace (if Tempo is added later)
        - name: requestId
          matcherRegex: '"requestId":"(\w+)"'
          url: '$${__value.raw}'
    editable: false
