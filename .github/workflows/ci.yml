# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Continuous Integration
# Triggers: push to any branch, pull requests to main
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:

  # ── 1. Lint + Type Check ───────────────────────────────────────────────────
  lint-api:
    name: "API — Lint & Types"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemosafe-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hemosafe-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  lint-web:
    name: "Web — Lint & Types"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemosafe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hemosafe-web/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  # ── 2. Unit Tests ──────────────────────────────────────────────────────────
  test-api:
    name: "API — Unit Tests"
    runs-on: ubuntu-latest
    needs: lint-api
    defaults:
      run:
        working-directory: hemosafe-api

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER:     hemosafe_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB:       hemosafe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hemosafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:          test
      DATABASE_URL:      postgresql://hemosafe_test:test_password@localhost:5432/hemosafe_test
      REDIS_URL:         redis://localhost:6379
      JWT_SECRET:        ci_test_secret_not_for_production
      JWT_EXPIRES_IN:    15m
      REFRESH_SECRET:    ci_refresh_secret_not_for_production
      REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hemosafe-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --coverage --forceExit
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: hemosafe-api/coverage
          flags: api

  # ── 3. Security audit ──────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit API deps
        run: |
          cd hemosafe-api
          npm audit --audit-level=high
      - name: Audit Web deps
        run: |
          cd hemosafe-web
          npm audit --audit-level=high
      - name: Scan with Trivy (SAST)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  # ── 4. Build Docker images ─────────────────────────────────────────────────
  build-images:
    name: "Build Docker images"
    runs-on: ubuntu-latest
    needs: [lint-api, lint-web, test-api]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context:    hemosafe-api
          file:       hemosafe-api/Dockerfile
          push:       true
          tags: |
            ghcr.io/${{ github.repository }}/hemosafe-api:latest
            ghcr.io/${{ github.repository }}/hemosafe-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context:    hemosafe-web
          file:       hemosafe-web/Dockerfile
          push:       true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            ghcr.io/${{ github.repository }}/hemosafe-web:latest
            ghcr.io/${{ github.repository }}/hemosafe-web:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/hemosafe-api:${{ github.sha }}
          format:    sarif
          output:    trivy-api.sarif
          severity:  HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
