# ─────────────────────────────────────────────────────────────────────────────
# fail2ban filter for HEMOSAFE Nginx auth endpoint
# Matches failed login attempts (HTTP 401 on /api/v1/auth/login)
# ─────────────────────────────────────────────────────────────────────────────

[Definition]
failregex = ^<HOST> .* "POST /api/v1/auth/login HTTP/[0-9.]+" 401
ignoreregex =
