# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — PostgreSQL pg_hba.conf (hardened)
# Reference: https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
#
# Apply: copy to postgres data dir, then: SELECT pg_reload_conf();
# ─────────────────────────────────────────────────────────────────────────────

# TYPE  DATABASE         USER              ADDRESS         METHOD

# ── Local socket (DBA maintenance only) ───────────────────────────────────────
# Only postgres superuser via local socket — avoids network exposure
local   all              postgres                          peer

# ── Replication ───────────────────────────────────────────────────────────────
# Replica connects from the private Docker network subnet
local   replication      replicator                        scram-sha-256
host    replication      replicator        172.20.0.0/16   scram-sha-256

# ── Application user (via PgBouncer connection pool) ─────────────────────────
# Only allow hemosafe_app user from the Docker network; no superuser login over network
host    hemosafe_prod    hemosafe_app      172.20.0.0/16   scram-sha-256

# ── Read-only analytics user (for postgres-exporter and Grafana) ──────────────
host    hemosafe_prod    hemosafe_ro       172.20.0.0/16   scram-sha-256

# ── Deny everything else ──────────────────────────────────────────────────────
host    all              all               0.0.0.0/0       reject
host    all              all               ::/0            reject
