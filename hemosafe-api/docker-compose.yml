version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hemosafe-postgres
    environment:
      POSTGRES_DB:       hemosafe
      POSTGRES_USER:     hemosafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hemosafe']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hemosafe-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemosafe-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL:   postgres://hemosafe:${POSTGRES_PASSWORD}@postgres:5432/hemosafe
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:     ${JWT_SECRET}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY}
      FRONTEND_URL:   ${FRONTEND_URL}
    ports:
      - '3001:3001'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
