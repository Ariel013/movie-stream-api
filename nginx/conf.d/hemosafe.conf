# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Virtual host configuration
# Replace DOMAIN_PLACEHOLDER with actual domain (e.g. hemosafe.minsante.gov.dz)
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    # ── TLS certificates (Let's Encrypt / internal CA) ──────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── Security headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                          always;
    add_header X-Content-Type-Options     nosniff                                       always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"    always;
    add_header Content-Security-Policy
        "default-src 'self';
         script-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
         style-src  'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
         font-src   'self' https://fonts.gstatic.com;
         img-src    'self' data: https://lh3.googleusercontent.com https://*.tile.openstreetmap.org;
         connect-src 'self' wss://DOMAIN_PLACEHOLDER;
         frame-ancestors 'none'"
        always;

    # ── Request ID for distributed tracing ──────────────────────────────
    add_header X-Request-ID $request_id always;

    # ── Connection limits ────────────────────────────────────────────────
    limit_conn conn_limit 20;

    # ── API proxy ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_cache_bypass $http_upgrade;

        # Don't buffer API responses (important for SSE / streaming)
        proxy_buffering off;
    }

    # ── Auth endpoints — extra strict rate limiting ───────────────────────
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Request-ID    $request_id;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "Upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_read_timeout 3600s;   # keep WebSocket alive for 1 hour
    }

    # ── Health check endpoint (public, no rate limit) ─────────────────────
    location /api/v1/health {
        proxy_pass       http://api_backend;
        access_log       off;     # don't pollute logs with health checks
        proxy_set_header Host $host;
    }

    # ── Swagger (disabled in production — uncomment for staging only) ──────
    # location /api/docs {
    #     return 403;
    # }

    # ── Static assets (Next.js _next/static) — long-term cache ────────────
    location /_next/static/ {
        proxy_pass http://web_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Service Worker — never cache ──────────────────────────────────────
    location /sw.js {
        proxy_pass http://web_backend;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ── Next.js frontend ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # ── Block common attack paths ──────────────────────────────────────────
    location ~* \.(env|git|bak|sql|sh|yml|yaml|conf)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
}
