# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Nginx main configuration
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;                      # one per CPU core
worker_rlimit_nofile 65535;                  # max open files per worker

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format (JSON for log aggregation) ──────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream":"$upstream_addr",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"x_request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens      off;           # hide nginx version

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/javascript
        image/svg+xml;

    # ── Buffer tuning ──────────────────────────────────────────────────────
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    client_max_body_size        10m;    # max upload (e.g. CSV import)
    large_client_header_buffers 4 8k;

    # ── Timeouts ───────────────────────────────────────────────────────────
    client_body_timeout    30s;
    client_header_timeout  30s;
    send_timeout           30s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     60s;        # long enough for PDF reports

    # ── Rate limiting zones ────────────────────────────────────────────────
    # Auth: 10 login attempts per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # API: 120 requests per minute per IP (burst to 30 instantly)
    limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=120r/m;

    # Upload: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

    limit_req_status 429;

    # ── Connection limiting ────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream load balancing ────────────────────────────────────────────
    upstream api_backend {
        least_conn;                     # send to least-loaded replica
        server api:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream web_backend {
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ── SSL session cache (shared across workers) ──────────────────────────
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Modern TLS only ───────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # Diffie-Hellman parameters (generate: openssl dhparam -out dhparam.pem 4096)
    ssl_dhparam /etc/nginx/dhparam.pem;

    # ── OCSP Stapling ─────────────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Load virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
