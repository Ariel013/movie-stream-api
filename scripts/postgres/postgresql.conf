# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL production configuration for HEMOSAFE
# Tuned for: 8GB RAM server, SSD storage, ~200 concurrent connections (via PgBouncer)
# ─────────────────────────────────────────────────────────────────────────────

# ── Connection settings ───────────────────────────────────────────────────
max_connections            = 100        # PgBouncer handles the pool
superuser_reserved_connections = 5

# ── Memory ────────────────────────────────────────────────────────────────
shared_buffers             = 2GB        # 25% of RAM
effective_cache_size       = 6GB        # 75% of RAM
work_mem                   = 64MB       # per sort/hash operation
maintenance_work_mem       = 512MB      # for VACUUM, CREATE INDEX
wal_buffers                = 64MB

# ── Parallel queries ──────────────────────────────────────────────────────
max_parallel_workers_per_gather = 2
max_parallel_workers       = 4
max_worker_processes       = 8

# ── WAL / Durability ──────────────────────────────────────────────────────
wal_level                  = replica    # enable streaming replication
fsync                      = on
synchronous_commit         = on
checkpoint_completion_target = 0.9
wal_compression            = on

# ── Write performance ─────────────────────────────────────────────────────
effective_io_concurrency   = 200        # SSDs: 200, HDD: 2
random_page_cost           = 1.1        # SSDs: ~1.1, HDD: 4.0
seq_page_cost              = 1.0

# ── Logging ───────────────────────────────────────────────────────────────
log_destination            = 'stderr'
logging_collector          = on
log_directory              = '/var/log/postgresql'
log_filename               = 'postgresql-%Y-%m-%d.log'
log_rotation_age           = 1d
log_rotation_size          = 100MB
log_min_duration_statement = 1000        # log queries > 1s (slow query log)
log_checkpoints            = on
log_connections            = off         # too noisy with PgBouncer
log_disconnections         = off
log_lock_waits             = on
log_line_prefix            = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement              = 'ddl'      # log all DDL statements

# ── Autovacuum ─────────────────────────────────────────────────────────────
autovacuum                 = on
autovacuum_max_workers     = 3
autovacuum_naptime         = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# ── Security ───────────────────────────────────────────────────────────────
ssl                        = on
ssl_cert_file              = '/etc/ssl/certs/server.crt'
ssl_key_file               = '/etc/ssl/private/server.key'
ssl_min_protocol_version   = 'TLSv1.2'
password_encryption        = scram-sha-256

# ── Replication ────────────────────────────────────────────────────────────
max_wal_senders            = 5
max_replication_slots      = 5
hot_standby                = on
hot_standby_feedback       = on
