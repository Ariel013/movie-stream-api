# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — PgBouncer configuration
# Connection pooling between NestJS API and PostgreSQL.
#
# Mode: transaction pooling — optimal for short-lived Prisma queries.
# Listens on: 0.0.0.0:5432 (Docker service alias "pgbouncer")
# Backend:     postgres:5432 (internal Docker network)
# ─────────────────────────────────────────────────────────────────────────────

[databases]
# Alias the production DB through PgBouncer
# API connects to: postgresql://hemosafe_app:***@pgbouncer:5432/hemosafe_prod
hemosafe_prod = host=postgres port=5432 dbname=hemosafe_prod

[pgbouncer]

# ── Network ───────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 5432

# ── Auth ─────────────────────────────────────────────────────────────────────
# scram-sha-256 requires PgBouncer 1.18+
auth_type     = scram-sha-256
auth_file     = /etc/pgbouncer/userlist.txt
# Delegate auth to PostgreSQL (avoids maintaining a separate user list)
auth_query    = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# ── Pooling ───────────────────────────────────────────────────────────────────
# transaction mode: connection returned to pool after each transaction
# Best for Prisma / short-lived queries; incompatible with advisory locks.
pool_mode = transaction

# Max client connections (API replicas × max_pool_size)
# 3 API replicas × 40 Prisma connections per replica = 120
max_client_conn = 200

# Backend connections per (user, database) pair
# PostgreSQL max_connections = 200; reserve 20 for DBA/replication
default_pool_size = 40

# Connections kept alive (warm pool)
min_pool_size = 10

# Extra reserve for spikes
reserve_pool_size = 5
reserve_pool_timeout = 3

# ── Timeouts ──────────────────────────────────────────────────────────────────
# Disconnect idle client after 10 minutes
client_idle_timeout = 600

# Disconnect idle server connection after 5 minutes
server_idle_timeout = 300

# Max time to wait for a connection from the pool (client gets error after this)
pool_mode_wait_timeout = 15

# ── Performance ───────────────────────────────────────────────────────────────
# Do not send DISCARD ALL between transactions (saves round-trips)
server_reset_query = DISCARD ALL
server_reset_query_always = 0

# Disable prepared statements (Prisma uses parameterized queries, not named ones)
# If using pgbouncer 1.21+ with prepared statement support, set to 1
disable_pqexec = 0

# ── TLS to backend ────────────────────────────────────────────────────────────
# Encrypt traffic between PgBouncer and PostgreSQL on the Docker network
server_tls_sslmode     = prefer
server_tls_protocols   = secure
client_tls_sslmode     = disable  # API connects within Docker network (no external TLS needed)

# ── Logging ───────────────────────────────────────────────────────────────────
log_connections = 0  # Disable per-connection logs to reduce noise
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60   # Log pool stats every 60s

# ── Admin interface ──────────────────────────────────────────────────────────
# Access with: psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
admin_users   = pgbouncer
stats_users   = hemosafe_ro
listen_addr   = 0.0.0.0
listen_port   = 5432
