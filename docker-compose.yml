version: "3.9"

services:
  movie-api:
    build: .
    container_name: movie-stream-api
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT:             ${PORT:-8000}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
    volumes:
      # Permet de mettre à jour le dataset sans rebuild
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  5s
      retries:  3
