# ─────────────────────────────────────────────────────────────────────────────
# HEMOSAFE — Development docker-compose
# Usage: docker compose up
# ─────────────────────────────────────────────────────────────────────────────

name: hemosafe-dev

services:

  # ── PostgreSQL with PostGIS ─────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: hemosafe-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER:     hemosafe
      POSTGRES_PASSWORD: hemosafe_dev_pwd
      POSTGRES_DB:       hemosafe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemosafe -d hemosafe_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hemosafe-redis-dev
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./hemosafe-api
      dockerfile: Dockerfile
      target: builder         # Use builder stage for dev (includes devDeps)
    container_name: hemosafe-api-dev
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env.dev
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
      - "9229:9229"           # Node.js debugger
    volumes:
      - ./hemosafe-api/src:/app/src:ro   # Hot reload in dev
    command: npm run start:dev

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ./hemosafe-web
      dockerfile: Dockerfile
      target: builder
    container_name: hemosafe-web-dev
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./hemosafe-web/src:/app/src:ro
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
